name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        sdk: [3.11.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
        if: matrix.sdk == 'stable'
      - run: dart analyze --fatal-infos
      - run: dart test

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.0
      - name: Pin direct dependencies to their lower bounds
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            analyzer: 13.0.0
            args: 2.6.0
            path: 1.9.0
            yaml: 3.1.2
          YAML
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
